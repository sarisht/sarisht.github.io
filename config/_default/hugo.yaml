# Hugo configuration. The site is a single page (layouts/index.html) built
# from data/*.yaml, content/publication/*, and content/event/*.
title: Sarisht Wadhwa
baseURL: 'https://sarisht.github.io/'
locale: en-us

disableKinds: [taxonomy, term, RSS]
enableRobotsTXT: true
enableEmoji: false

markup:
  goldmark:
    renderer:
      unsafe: true

taxonomies: {}

ignoreFiles: ['\.DS_Store$']
buildFuture: true
